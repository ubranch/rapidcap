name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # `.cargo/config.toml` points target-dir at a sibling of the repo, which is
  # outside the checkout on a runner. The env var wins over the config file, so
  # this redirects CI builds back inside the workspace without the local dev
  # setup having to change.
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: windows (shipping target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Matches rust-toolchain.toml; the action reads it but naming the
          # components here is what installs them.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  macos:
    name: macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  package-macos:
    name: macos (app bundle)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-macos.sh
      # Tarred rather than handed to upload-artifact whole, because the artifact
      # zip drops the executable bit and flattens symlinks - a .app that comes
      # back down without either is not a .app.
      - run: tar -czf RapidCap-macos.tar.gz -C dist RapidCap.app
      - uses: actions/upload-artifact@v4
        with:
          name: RapidCap-macos
          path: RapidCap-macos.tar.gz
